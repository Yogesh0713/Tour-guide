<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour Guide — Admin</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .admin-wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .admin-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .admin-stat { background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 14px; }
    .admin-stat span { font-size: 0.8rem; color: var(--text-secondary); }
    .admin-stat strong { display: block; font-size: 1.4rem; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .admin-tab { padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); background: var(--bg-tertiary); color: var(--text-primary); cursor: pointer; }
    .admin-tab.active { background: var(--primary-warm); border-color: var(--primary-warm); color: #fff; }
    .admin-card { background: var(--bg-secondary); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 14px; display: flex; gap: 14px; margin-bottom: 12px; }
    .admin-card img { width: 120px; height: 90px; object-fit: cover; border-radius: var(--radius-sm); flex-shrink: 0; }
    .admin-card-body { flex: 1; min-width: 0; }
    .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .admin-btn { padding: 8px 14px; border: none; border-radius: var(--radius-sm); font-weight: 600; color: #fff; cursor: pointer; }
    .admin-btn.ok { background: var(--success); }
    .admin-btn.no { background: var(--warning); }
    .admin-btn.del { background: var(--danger); }
    @media (max-width: 520px) {
      .admin-card { flex-direction: column; }
      .admin-card img { width: 100%; height: 160px; }
    }
  </style>
</head>
<body style="background: var(--bg-primary); color: var(--text-primary);">
  <div class="admin-wrap">
    <div class="admin-top">
      <h2>🛡️ Admin panel</h2>
      <a href="index.html">← Back to map</a>
    </div>
    <div class="admin-stats" id="adminStats"></div>
    <div class="admin-tabs" id="adminTabs"></div>
    <div id="adminList"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
