<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tour Guide — Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="logo-icon">🗺️</span>
        <h1>Tour Guide</h1>
        <p>Discover amazing places near you</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div id="loginError" class="auth-error hidden"></div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-pass" onclick="togglePassword('password')">👁️</button>
          </div>
        </div>

        <button type="submit" class="btn-primary btn-full" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-loader hidden">⏳</span>
        </button>

        <p class="auth-footer">
          Don't have an account?
          <a href="register.html">Create one free →</a>
        </p>
      </form>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
